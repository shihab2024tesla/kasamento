<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Bridal Suite — Kasamento</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side routing, so a direct hit on a deep
      // link (e.g. /login) 404s before React Router gets a chance to run.
      // This redirects back to index.html with the intended path encoded
      // in the query string; index.html's inline script decodes it.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
